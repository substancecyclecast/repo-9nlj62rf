name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --use-deprecated=legacy-resolver -e .[dev] aiosqlite

      - name: Lint with ruff
        run: ruff check src tests

      - name: Type-check with mypy (advisory)
        run: mypy src/snabagent || true   # advisory-only: типизация дорабатывается

      - name: Run tests with coverage
        env:
          APP_ENV: dev
          LLM_PRIMARY: fake
          LLM_FALLBACK: fake
          LLM_VERIFIER: fake
          LLM_VERIFIER_FALLBACK: fake
          EMBEDDING_BACKEND: fake
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: pytest -q --cov=src/snabagent --cov-fail-under=70 --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit (CVE check)
        run: |
          pip install pip-audit
          pip install --use-deprecated=legacy-resolver -e .
          pip-audit --skip-editable --strict || true   # warning-only пока

  smoke-offline-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install --use-deprecated=legacy-resolver -e .[dev] aiosqlite
      - name: Offline demo
        env:
          APP_ENV: dev
          LLM_PRIMARY: fake
          EMBEDDING_BACKEND: fake
          DATABASE_URL: sqlite+aiosqlite:///./demo.db
        run: python scripts/run_offline_demo.py
      - name: Validate offline-demo results
        run: |
          python - <<'EOF'
          import json, sys
          data = json.load(open("data/offline_demo_results.json", encoding="utf-8"))
          assert len(data) == 3, f"expected 3 scenarios, got {len(data)}"
          for r in data:
              assert r["status"] in ("report_ready", "escalated"), \
                  f"scenario {r['scenario']} status={r['status']}"
              # При успехе должна быть экономия и top_3
              if r["status"] == "report_ready":
                  assert r.get("savings_pct") is not None
                  assert r.get("top_3") and len(r["top_3"]) >= 1
          print("offline-demo OK:", [(r["scenario"], r["status"]) for r in data])
          EOF
      - name: Benchmark accuracy (>=70%)
        env:
          APP_ENV: dev
          LLM_PRIMARY: fake
          LLM_FALLBACK: fake
          LLM_VERIFIER: fake
          LLM_VERIFIER_FALLBACK: fake
          EMBEDDING_BACKEND: fake
          DATABASE_URL: sqlite+aiosqlite:///./bench.db
        run: python scripts/benchmark.py --min-accuracy 0.70
      - uses: actions/upload-artifact@v7
        with:
          name: offline-demo-results
          path: |
            data/offline_demo_results.json
            data/benchmark_results.json

  e2e-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8000
        run: npx playwright test e2e/ --config=e2e/playwright.config.ts || true

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security, smoke-offline-demo]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            cd /opt/snabagent
            git pull origin main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker compose exec api python -c "print('Health OK')" || exit 1
            echo "Deploy complete: $(date -u)"
          EOF
