version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    command: uvicorn snabagent.api.main:app --host 0.0.0.0 --port 8000 --workers 1 --log-level warning
    ports:
      - "8000:8000"
    restart: unless-stopped
