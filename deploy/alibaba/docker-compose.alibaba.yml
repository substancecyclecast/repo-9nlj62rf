# SnabAgent — Alibaba Cloud ECS deployment (single-node, Qwen-powered)
#
# Self-contained stack for one ECS instance (2 vCPU / 4 GB is enough for the demo):
#   FastAPI + Celery worker + Streamlit UI + Postgres + Qdrant + Redis.
#
# Usage on the ECS box:
#   cp deploy/alibaba/.env.alibaba.example .env    # then fill LLM_QWEN_API_KEY
#   docker compose -f deploy/alibaba/docker-compose.alibaba.yml up -d --build
#
# The LLM provider is Qwen Cloud (Alibaba DashScope) — no other API keys required.
name: snabagent-alibaba

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-snabagent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snab}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    restart: unless-stopped

  # One-shot: applies DB migrations then exits (compose dependents wait for it).
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: uvicorn snabagent.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    env_file: ../../.env
    depends_on:
      - postgres
      - redis
      - qdrant
    command: celery -A snabagent.tasks.celery_app worker -l INFO -Q lots,emails -c 2
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  streamlit:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    env_file: ../../.env
    environment:
      - STREAMLIT_API_BASE=http://api:8000
    depends_on:
      - api
    command: streamlit run /app/src/snabagent/ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_storage:
